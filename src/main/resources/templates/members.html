<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />

	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<link th:href="@{/css/style.css}" rel="stylesheet" />

	<title>登録者一覧</title>
</head>

<body>

<div class="container">

	<h1 class="mt-4 mb-4">受講生選択</h1>

	<div class="mb-3">
		<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>

	</div>
	<form th:action="@{/search}" method="get" class="card p-3 mb-4">

		<div class="row mb-3 align-items-center">
			<label class="col-sm-2 col-form-label">ID検索</label>
			<div class="col-sm-6">
				<input type="text"
					   name="id"
					   class="form-control"
					   placeholder="前方一致" />
			</div>
		</div>

		<div class="row mb-3 align-items-center">
			<label class="col-sm-2 col-form-label">氏名検索</label>
			<div class="col-sm-6">
				<input type="text"
					   name="name"
					   class="form-control"
					   placeholder="部分一致" />
			</div>
		</div>

		<div>
			<input type="submit"
				   value="検索"
				   class="btn btn-primary" />
		</div>

	</form>

	<table class="table table-striped table-bordered table-hover">

		<thead class="table-dark">
			<tr>
				<th>ID</th>
				<th>氏名</th>
				<th>年齢</th>
				<th>住所</th>
				<th>登録日</th>
				<th></th>
			</tr>
		</thead>

		<tbody>
			<tr th:each="m : ${members}">

				<td>[[${m.id}]]</td>
				<td>[[${m.name}]]</td>
				<td>[[${m.age}]]</td>
				<td>[[${m.address}]]</td>
				<td>[[${#temporals.format(m.created,
				'yyyy 年 MM 月 dd 日 HH:mm:ss')}]]</td>
				<td> <a th:href="@{/member/{id}(id=${m.id})}" class="btn btn-secondary">選択</a></td>
			</tr>
		</tbody>
	</table>
</div>

<!-- 2 ページ以上の場合、ページネーションを表示:start -->
<div th:if="${totalPages >= 2}" class="container">
 <ul class="pagination">
 <!-- 前のページへ -->
 	<th:block th:switch="${page}">
 		<li th:case="1" class="page-item disabled">
 			<a class="page-link" href="">&laquo;</a>
 		</li>
 		<li th:case="*" class="page-item">
 			<a class="page-link" th:href="@{/show(page=${page -1})}">&laquo;</a>
 		</li>
 	</th:block>
 <!-- ページ番号 -->
 		<th:block th:each="index : ${#numbers.sequence(1, totalPages)}">
 			<th:block th:switch="${index}">
 				<li th:case="${page}" class="page-item active">
 					<a class="page-link" href="">[[${index}]]</a>
 				</li>
 				<li th:case="*" class="page-item">
  				<a class="page-link" th:href="@{/show(page=${index})}">[[${index}]]</a>
  			</li>
  		</th:block>
  	</th:block>
  <!-- 次のページへ -->
  	<th:block th:switch="${page}">
  		<li th:case="${totalPages}" class="page-item disabled">
  			<a class="page-link" href="">&raquo;</a>
  		</li>
  		<li th:case="*" class="page-item">
  			<a class="page-link" th:href="@{/show(page=${page + 1})}">&raquo;</a>
  		</li>
  	</th:block>
  </ul>
 </div>
 <!-- 2 ページ以上の場合、ページネーションを表示:end -->

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
