<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Document</title>
</head>
<body>
 <h1>登録</h1>
 	<form th:action="@{/add}" method="post" th:object="${course}">
		<ul>
			<li>タイトル：
				<input type="text" th:field="*{title}"/>
			</li>
			<li>内容：
				<input type="text" th:field="*{detail}"/>
			</li>
			<li>教室：
				<select th:field="*{classId}">
					<option th:each="c : ${room}" th:value="${c.id}"
								th:text="${c.classRoom}"></option>
				</select>	
			</li>
			<li>定員：
							<input type="number" th:field="*{courseCapacity.capacity}"/>
			</li>
				<input type="submit" />
		</ul>


	</form>
 <a href="/menu">メニュー</a>
</body>
</html>
