<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<link th:href="@{/css/style.css}" rel="stylesheet" />
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<title>Document</title>
</head>
<body>
<h1 class="mt-4 mb-4 ms-5">講座登録</h1>
 	<form th:action="@{/add}" method="post" th:object="${course}" id="courseForm" class="ms-5 mt-3">

			<div class="mb-3">
			 	<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
			 	<a th:href="@{/show}" class="btn btn-secondary">講座一覧</a>
				<a th:href="@{/roomSchedules}" class="btn btn-secondary">空き教室確認</a>
			</div>


				<div th:if="${statusMessage}" class="alert alert-success mt-4 w-50 py-2 mb-2 rounded">
				    <span th:text="${statusMessage}"></span>
				</div>

				<div th:if="${errorMessage}" class="alert alert-danger mt-4 w-50 py-2 mb-2 rounded">
				    <span th:text="${errorMessage}"></span>
				</div>

			<p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="alert alert-danger mt-4 w-50 py-2 mb-2 rounded"></p>
			<div class="mb-3">
				<label for="formTitle">タイトル</label>
         <input type="text"	th:field="*{title}"	id="formTitle"
		             	class="form-control w-50"/>
			</div>

			<p th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}" class="alert alert-danger mt-4 w-50 py-2 mb-2 rounded"></p>
			<div class="mb-3">
				<label for="formNote">内容</label>
			  <textarea th:field="*{detail}" maxlength="2000" id="formNote" class="form-control w-50"></textarea>
			</div>

			<div class="mb-3">
				<label for="courseCount">回数</label>
			  <input type="number" th:field="*{courseTerm}"	onkeydown="return false" id="courseCount"
			       	class="form-control w-50"/>
			</div>

			<div class="mb-3" id="container">
				<label for="formName">途中受講</label><br>
			  <label><input type="radio" th:field="*{allowLateEnrollment}" 
					id="allowTrue" class="form-check-label" value="true"/>可　</label>
				<label><input type="radio" th:field="*{allowLateEnrollment}" 
					id="allowFalse" class="form-check-label" value="false" />不可　</label>
				<div class="text-danger" th:if="${#fields.hasErrors('allowLateEnrollment')}" th:errors="*{allowLateEnrollment}"></div>	
			</div>

			<div class="mb-3">
				<label for="datePicker">開催日</label>
    		<div class="d-flex gap-2">
        <!-- ここはただの選択欄。nameやth:fieldは一切不要 -->
        	<input type="date" id="datePicker"
							min="2026-05-01" max="2026-09-30"
              onkeydown="return false"
              class="form-control" style="width: 200px;"/>
	        <button type="button" id="addDateBtn" class="btn btn-secondary">追加</button>
  	  	</div>
    		<small id="dateError" style="color: red; display: block; margin-top: 0.25rem;"></small>
			</div>

			<!-- 追加された日付がここに [0], [1], [2]... と並ぶ -->
			<div class="mb-3 w-50">
    		<label>選択済みの開催日一覧</label>
    			<ul id="selectedDateList" class="list-group">
        <!-- ここにJavaScriptで動的にliとhiddenパラメータが追加される -->
    			</ul>
			</div>

			<div class="mb-3">
				<label for="formName">開始時間</label>
<!--			  <input type="time" th:field="*{classRoomSchedule.startTime}" min="10:00" max="15:00" step="900"-->
<!--				onkeydown="return false" id="formStartTime"	class="form-control"/>-->
				<select th:field="*{classRoomSchedule[0].startTime}" id="formStartTime" class="form-control w-50">
<!-- 💡 10時から14時までループを回し、各時で0分、15分、30分、45分のオプションを生成 -->
	        <th:block th:each="hour : ${#numbers.sequence(10, 16)}">
						<th:block th:each="min : ${#numbers.sequence(0, 30, 30)}">
							<th:block th:if="${!(hour == 16 && min == 30)}">
								<option th:with="hStr=${#numbers.formatInteger(hour, 2)}, mStr=${#numbers.formatInteger(min, 2)}"
							  	      th:value="${hStr + ':' + mStr}"
							    	    th:text="${hStr + ':' + mStr}">
             		</option>
							</th:block>
           	</th:block>
    			</th:block>
 				</select>
			</div>

			<div class="mb-3" id="periodContainer">
				<label for="formName">講座時間</label><br>
			  <label><input type="radio" name="basePeriod" class="course-period"
											value="60" checked/>60分　</label>
				<label><input type="radio" name="basePeriod" class="course-period"
											value="90"/>90分　</label>
			  <label><input type="radio" name="basePeriod" class="course-period"
											value="120"/>120分　</label>
			</div>

			<div class="mb-3">
			<label for="formLocation">教室</label>
				<select th:field="*{classRoomId}"  id="formLocation" class="form-control w-50">
				  <option th:each="r : ${classRoomList}" th:value="${r.id}" th:text="${r.classRoom}">
					</option>
			  </select>
			</div>

			<p th:if="${#fields.hasErrors('courseCapacity.capacity')}" th:errors="*{courseCapacity.capacity}" class="alert alert-danger mt-4 w-50 py-2 mb-2 rounded"></p>
			<div class="mb-3">
			<label for="formCapacity">定員</label>
					<input type="number" th:field="*{courseCapacity.capacity}"
				         id="formCapacity" onkeydown="return false" class="form-control w-50"/>
			</div>
			
			<p th:if="${#fields.hasErrors('tuitionFee')}" th:errors="*{tuitionFee}" class="alert alert-danger mt-4 w-50 py-2 mb-2 rounded"></p>
			<div class="mb-3">
			<label for="formCapacity">受講料単価</label>
					<input type="number" th:field="*{tuitionFee}"
				          class="form-control w-50"/>
			</div>
			
			
			<p th:if="${#fields.hasErrors('materialFee')}" th:errors="*{materialFee}" class="alert alert-danger mt-4 w-50 py-2 mb-2 rounded"></p>
			<div class="mb-3">
			<label for="formCapacity">教材費</label>
					<input type="number" th:field="*{materialFee}"
				          class="form-control w-50"/>
			</div>
			
			
			<input type="submit" class="btn btn-primary" value="登録"/>
	</form>
<!-- 			<script th:src="@{/js/bootstrap.bundle.min.js}"></script>-->

<script>
let addedDates = []; // 追加された日付を記録する配列

// リストの連番（name属性のインデックス）を上から順に綺麗に詰め直す関数
function reIndexSchedules() {
    const listItems = document.querySelectorAll('#selectedDateList .list-group-item');
    listItems.forEach((li, index) => {
        const hiddenDate = li.querySelector('.hidden-date');
        if (hiddenDate) {
            hiddenDate.name = `classRoomSchedule[${index}].date`;
        }
        const hiddenPeriod = li.querySelector('.hidden-period');
        if (hiddenPeriod) {
            hiddenPeriod.name = `classRoomSchedule[${index}].coursePeriod`;
        }
    });
}

//　途中受講可不可フラグの制御
document.addEventListener('DOMContentLoaded', function () {
    const termInput = document.getElementById('courseCount');
    const allowTrueRadio = document.getElementById('allowTrue');
    const allowFalseRadio = document.getElementById('allowFalse');

		// 要素が存在しない場合のエラー防止ガード
		if (!termInput || !allowTrueRadio || !allowFalseRadio) return;
				
    function toggleLateEnrollment() {
        const termValue = parseInt(termInput.value, 10) || 0;
        
        if (termValue < 2) {
            // 2未満の場合は「可」を非活性化し、自動的に「不可」をチェック
            allowTrueRadio.disabled = true;
            allowFalseRadio.checked = true;
        } else {
            // 2以上の場合は「可」を選択可能にする
            allowTrueRadio.disabled = false;
        }
    }

    // 初期表示時と、回数入力変更時に実行
    termInput.addEventListener('input', toggleLateEnrollment);
		termInput.addEventListener('change', toggleLateEnrollment);
		// 初期表示チェック
    toggleLateEnrollment();
});


// 💡 【新規】開始時間と講座時間から、17:00を超えるかチェックしてラジオボタンの有効/無効を切り替える関数
function validatePeriods() {
    const startTimeVal = document.getElementById('formStartTime').value; // "15:30" など
    if (!startTimeVal) return;

    const [hour, min] = startTimeVal.split(':').map(Number);
    const startTotalMinutes = hour * 60 + min;
    const maxTotalMinutes = 17 * 60; // 17:00 は 1020分

    const radios = document.querySelectorAll('input[name="basePeriod"]');
    let currentCheckedValid = false;
    let firstAvailableRadio = null;

    radios.forEach(radio => {
        const periodMin = parseInt(radio.value, 10);
        // 終了時間（分）を計算
        if (startTotalMinutes + periodMin > maxTotalMinutes) {
            radio.disabled = true;
            radio.parentElement.style.opacity = "0.5"; // 見た目を選択不可に
        } else {
            radio.disabled = false;
            radio.parentElement.style.opacity = "1.0";
            if (!firstAvailableRadio) firstAvailableRadio = radio;
            if (radio.checked) currentCheckedValid = true;
        }
    });

    // 💡 もし「現在選択されているラジオボタン」が無効化されてしまった場合、選択可能な一番短い時間に強制切り替え
    if (!currentCheckedValid && firstAvailableRadio) {
        firstAvailableRadio.checked = true;
        // 隠しパラメータも同期させる
        updateAllHiddenPeriods(firstAvailableRadio.value);
    }
}

// 全ての隠しパラメータの講座時間を一括更新する共通関数
function updateAllHiddenPeriods(value) {
    const allHiddenPeriods = document.querySelectorAll('.hidden-period');
    allHiddenPeriods.forEach(hiddenInput => {
        hiddenInput.value = value;
    });
}

// 開始時間が変更されたらチェックを走らせる
document.getElementById('formStartTime').addEventListener('change', validatePeriods);

// ラジオボタンが切り替わったら、選択された分ですべての隠しパラメータを上書きする
document.querySelectorAll('input[name="basePeriod"]').forEach(radio => {
    radio.addEventListener('change', function() {
        if (!this.disabled) {
            updateAllHiddenPeriods(this.value);
        }
    });
});

// 初期表示時にも一度チェックを実行して17時超えを防ぐ
document.addEventListener('DOMContentLoaded', validatePeriods);


document.getElementById('addDateBtn').addEventListener('click', function() {
		const maxCount = parseInt(document.getElementById('courseCount').value, 10);
		const dateInput = document.getElementById('datePicker');
    const selectedDate = dateInput.value;
    const errorElement = document.getElementById('dateError');

	  if (isNaN(maxCount) || maxCount <= 0) {
	       errorElement.textContent = '講座回数を入力してください。';
	       return;
	   }

	  if (addedDates.length >= maxCount) {
	      errorElement.textContent = `この講座は全 ${maxCount} 回です。これ以上日付を追加できません`;
	      return;
	    }

    if (!selectedDate) {
        errorElement.textContent = '日付を選択してください';
        return;
    }

    if (addedDates.includes(selectedDate)) {
        errorElement.textContent = 'この日付はすでに選択済みです';
        return;
    }

    errorElement.textContent = '';
    addedDates.push(selectedDate);

    const index = addedDates.length - 1;
    const list = document.getElementById('selectedDateList');

    const li = document.createElement('li');
    li.className = 'list-group-item d-flex justify-content-between align-items-center';

		const textSpan = document.createElement('span');
	  textSpan.textContent = selectedDate;
	  li.appendChild(textSpan);

	  const deleteBtn = document.createElement('button');
	  deleteBtn.type = 'button';
	  deleteBtn.className = 'btn btn-danger btn-sm';
	  deleteBtn.textContent = '削除';

	    deleteBtn.addEventListener('click', function() {
	        addedDates = addedDates.filter(date => date !== selectedDate);
	        li.remove();
	        reIndexSchedules();
	        errorElement.textContent = '';
	    });

		const selectedPeriodElement = document.querySelector('input[name="basePeriod"]:checked');
		const currentPeriod = selectedPeriodElement ? selectedPeriodElement.value : "60";


    const hiddenDate = document.createElement('input');
    hiddenDate.type = 'hidden';
    hiddenDate.className = 'hidden-date';
    hiddenDate.name = `classRoomSchedule[${index}].date`;
    hiddenDate.value = selectedDate;

    const hiddenPeriod = document.createElement('input');
    hiddenPeriod.type = 'hidden';
    hiddenPeriod.className = 'hidden-period';
    hiddenPeriod.name = `classRoomSchedule[${index}].coursePeriod`;
		hiddenPeriod.value = currentPeriod;

    li.appendChild(hiddenDate);
    li.appendChild(hiddenPeriod);
		li.appendChild(deleteBtn);
    list.appendChild(li);

    dateInput.value = '';
});


		// フォーム送信時のチェック
		document.getElementById('courseForm').addEventListener('submit', function(event) {
    	const maxCount = parseInt(document.getElementById('courseCount').value, 10);
			const startTimeVal = document.getElementById('formStartTime').value;
			const selectedPeriodElement = document.querySelector('input[name="basePeriod"]:checked');
			const periodError = document.getElementById('periodError');

			// 1. 17時を超えていないか最終バリデーション
			if (startTimeVal && selectedPeriodElement) {
				const [hour, min] = startTimeVal.split(':').map(Number);
				const startTotalMinutes = hour * 60 + min;
				const periodMin = parseInt(selectedPeriodElement.value, 10);

				if (startTotalMinutes + periodMin > 1020) { // 17:00超え 17:00 は 1020分
					periodError.textContent = '終了時間が17:00を超えるため、この組み合わせでは登録できません。';
					event.preventDefault();
					return;
				}
			}

	    if (addedDates.length !== maxCount) {
  	    alert(`設定された講座回数（${maxCount}回）に対して、開催日が${addedDates.length}日しか選択されていません。`);
        event.preventDefault();
    }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
