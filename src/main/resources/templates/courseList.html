<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />

	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<link th:href="@{/css/style.css}" rel="stylesheet" />

	<title>講座一覧</title>
</head>

<body>

<td class="container">

	<h1 class="mt-4 mb-4">講座一覧</h1>

	<div class="mb-3">
		<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
		<a th:href="@{/add}" class="btn btn-primary">講座登録</a>
		<a th:href="@{/roomSchedules}" class="btn btn-secondary">空き教室確認</a>
	</div>
	<!-- 検索フォームエリア -->
	<div class="search-box mb-4 p-3 bg-light border rounded">
	  <form th:action="@{/show}" method="get" class="row g-3 align-items-center">

	    <div class="col-auto">
	      <label class="col-form-label fw-bold">絞り込み条件：</label>
	    </div>

	    <!-- ラジオボタンによる切り替え例 -->
	    <div class="col-auto">
	      <div class="form-check form-check-inline">
	        <input class="form-check-input" type="radio" name="searchType" id="searchAll" value="all"
	               th:checked="${searchType == null or searchType == 'all'}" onchange="this.form.submit()">
	        <label class="form-check-label" for="searchAll">すべての講座</label>
	      </div>

	      <div class="form-check form-check-inline">
	        <input class="form-check-input" type="radio" name="searchType" id="searchLate" value="lateEnrollment"
	               th:checked="${searchType == 'lateEnrollment'}" onchange="this.form.submit()">
	        <label class="form-check-label" for="searchLate">受付中の講座</label>
	      </div>
	    </div>

	  </form>
	</div>

	<table class="table table-hover table-bordered align-middle table-striped">

		<thead class="table-dark text-center align-middle border-light">
			<tr>
				<th>講座番号</th>
				<th>タイトル</th>
				<th>回数</th>
				<th>教室</th>
				<!-- 4項目をまとめたヘッダー列 -->
				<th style="min-width: 340px;" class="p-0">
					<div class="row g-0 h-100 text-center fw-bold align-items-center">
						<div class="col-4 border-end py-2">開催日</div>
						<div class="col-3 border-end py-2">開始</div>
						<div class="col-3 border-end py-2">終了</div>
						<div class="col-2 py-2">状態</div>
					</div>
				</th>
				<th>定員</th>
				<th>申込数</th>
				<th>空き</th>
				<th>途中受講</th>

				<th>詳細</th>
			</tr>
		</thead>

		<tbody>
			<tr th:each="c : ${courses}" class="h-100">
				<td th:text="${c.courseId}"></td>
				<td th:text="${c.title}"></td>
				<td class="text-center" th:text="${c.courseTerm}"></td>
				<td class="text-center" th:text="${c.classRoom.classRoom}"></td>

				<td class="p-0 schedule-cell">
					<div class="d-flex flex-column h-100 ">
						<div th:each="s : ${c.classRoomSchedule}"
								class="row g-0 flex-grow-1 text-center"
								th:with="isEnded=${
									s.date.isBefore(#temporals.createToday())
									or (s.date.isEqual(#temporals.createToday())
									and s.startTime.isBefore(#temporals.createNow().toLocalTime()))
								}">

							<div class="col-4 border-end" th:text="${s.date}"></div>
							<div class="col-3 border-end" th:text="${s.startTime}"></div>
							<div class="col-3 border-end" th:text="${s.endTime}"></div>
							<div class="col-2 ">
								<span th:if="${s.scheduleStatus == 'CANCELLED_COURSE'}" class="badge bg-danger">中止</span>
								<span th:if="${s.scheduleStatus == 'CANCELLED_SESSION'}" class="badge bg-warning">休講</span>
								<span th:if="${s.scheduleStatus != 'CANCELLED_COURSE'
														and s.scheduleStatus != 'CANCELLED_SESSION'
														and isEnded}"
										class="badge bg-secondary">終了</span>
							</div>
						</div>
					</div>
				</td>

				<td class="text-center" th:text="${c.courseCapacity.capacity}"></td>
				<td class="text-center" th:text="${c.courseCapacity.numberOfApplicant}"></td>
				<td class="text-center"	th:text="${c.courseCapacity.capacity - c.courseCapacity.numberOfApplicant}"></td>
				<td class="text-center" th:text="${c.allowLateEnrollment ? '可' : '不可'}"></td>
				<td class="text-center">
					<a th:href="@{/show/{id}(id=${c.courseId},page=${page},searchType=${searchType})}"
						class="btn btn-secondary">詳細</a>
				</td>
<!--				class="btn" th:classappend="${c.allowLateEnrollment} ? 'btn-primary':'btn-secondary'">詳細</a></td>-->


			</tr>
		</tbody>
	</table>
</td>

<!-- ページネーションリンクエリア -->
<!-- 2 ページ以上の場合、ページネーションを表示:start -->
<div th:if="${totalPages >= 2}" class="container mt-3">

	<div class="d-flex justify-content-center gap-1 flex-wrap">

		<!-- 前のページ -->
		<th:block th:switch="${page}">
			<span th:case="1" class="btn btn-secondary disabled">&laquo;</span>

			<a th:case="*"
			   th:href="@{/show(page=${page - 1},searchType=${searchType})}"
			   class="btn btn-secondary">
				&laquo;
			</a>
		</th:block>

		<!-- ページ番号 -->
		<th:block th:each="index : ${#numbers.sequence(1, totalPages)}">

			<th:block th:switch="${index}">

				<span th:case="${page}"
				      class="btn btn-dark">
					[[${index}]]
				</span>

				<a th:case="*"
				   th:href="@{/show(page=${index},searchType=${searchType})}"
				   class="btn btn-secondary">
					[[${index}]]
				</a>

			</th:block>

		</th:block>

		<!-- 次のページ -->
		<th:block th:switch="${page}">

			<span th:case="${totalPages}"
			      class="btn btn-secondary disabled">
				&raquo;
			</span>

			<a th:case="*"
			   th:href="@{/show(page=${page + 1},searchType=${searchType})}"
			   class="btn btn-secondary">
				&raquo;
			</a>

		</th:block>

	</div>

</div>
<!-- 2 ページ以上の場合、ページネーションを表示:end -->

</body>
