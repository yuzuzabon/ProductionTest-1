<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Document</title>
</head>
<body>
 <h1>一覧</h1>
 	<table>

		<tr align="left">
			<th width="100">講座番号</th>
			<th  width="250">タイトル</th>
			<th>教室</th>
			<th>日付</th>
			<th>開始時間</th>
			<th>終了時間</th>
			<th>定員</th>
			<th>申込数</th>
			<th>空き</th>

 		</tr>
 		<tr th:each=" c : ${course} ">
			<td>[[${c.courseId}]]</td>
			<td>[[${c.title}]]</td>
			<td align="center">[[${c.classRoom.classRoom}]]</td>
			<td align="center">[[${c.classRoomSchedule.date}]]</td>
			<td align="center">[[${c.classRoomSchedule.startTime}]]</td>
			<td align="center">[[${c.classRoomSchedule.endTime}]]</td>
			<td align="center">[[${c.courseCapacity.capacity}]]</td>
			<td align="center">[[${c.courseCapacity.numberOfApplicant}]]</td>
			<td th:text="${c.courseCapacity.capacity} - ${c.courseCapacity.numberOfApplicant}"></td>


		</tr>
	</table>
 		<a href="/menu">メニュー</a>
		<a href="/add">登録</a>
</body>
</html>
