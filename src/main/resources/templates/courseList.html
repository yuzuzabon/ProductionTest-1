<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />

	<link th:href="@{/css/style.css}" rel="stylesheet" />
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />

	<title>講座一覧</title>
</head>

<body>

<div class="container">

	<h1 class="mt-4 mb-4">講座一覧</h1>

	<div class="mb-3">
		<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
		<a th:href="@{/add}" class="btn btn-secondary">講座登録</a>
	</div>

	<table class="table table-striped table-bordered table-hover">

		<thead class="table-dark">
			<tr>
				<th>講座番号</th>
				<th>タイトル</th>
				<th>回数</th>
				<th>教室</th>
				<th>日付</th>
				<th>開始時間</th>
				<th>終了時間</th>
				<th>定員</th>
				<th>申込数</th>
				<th>空き</th>
			</tr>
		</thead>

		<tbody>
			<tr th:each="c : ${courses}">

				<td>[[${c.courseId}]]</td>
				<td>[[${c.title}]]</td>
				<td class="text-center">[[${c.numberOfDays}]]</td>
				<td class="text-center">[[${c.classRoom.classRoom}]]</td>
				<td><div th:each="s : ${c.classRoomSchedule}" class="text-center">[[${s.date}]]</div></td>
				<td><div th:each="s : ${c.classRoomSchedule}" class="text-center">[[${s.startTime}]]</div></td>
				<td><div th:each="s : ${c.classRoomSchedule}" class="text-center">[[${s.endTime}]]</div></td>
				<td class="text-center">[[${c.courseCapacity.capacity}]]</td>
				<td class="text-center">[[${c.courseCapacity.numberOfApplicant}]]</td>
				<td class="text-center"	th:text="${c.courseCapacity.capacity - c.courseCapacity.numberOfApplicant}"></td>
			</tr>
		</tbody>
	</table>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
