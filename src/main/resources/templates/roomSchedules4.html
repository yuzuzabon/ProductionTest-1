<!doctype html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />

<link th:href="@{/css/style.css}" rel="stylesheet" />
<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
<title>空き教室確認</title>
</head>
<body>
<div class="container">
<h1 class="mt-4 mb-4">空き教室確認</h1>
<div class="mb-3">
	<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
	<a th:href="@{/show}" class="btn btn-secondary">一覧</a>
	<a th:href="@{/add}" class="btn btn-primary">講座登録</a>
</div>

<div class="mb-4">
	<a th:href="@{roomSchedules4(baseDate=${prevDate})}"
	   class="btn btn-secondary">
		前週
	</a>

	<a th:href="@{roomSchedules4}"
	   class="btn btn-secondary">
		今週
	</a>

	<a th:href="@{roomSchedules4(baseDate=${nextDate})}"
	   class="btn btn-secondary">
		翌週
	</a>
</div>

<div class="mb-4">
	<label for="datePicker" class="form-label">
		表示開始日
	</label>

	<input type="date"
		   id="datePicker"
		   class="form-control"
		   th:value="${baseDate}"
		   onchange="location.href='/roomSchedules4?baseDate='+this.value">
</div>

<div th:each="roomEntry : ${occupiedMap.occupiedMap}" class="mb-5">

	<h3 class="text-primary mb-3"
		th:text="${roomEntry.key}">
		教室名
	</h3>

	<table class="table table-striped table-bordered table-hover text-center align-middle">

		<thead class="table-dark">
			<tr>
				<th>時間 / 日付</th>

				<th th:each="date : ${occupiedMap.dateList}"
					th:text="${date}">
					日付
				</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="time : ${occupiedMap.timeList}">
				<td class="fw-bold"
					th:text="${time}">
					10:00
				</td>
				<td th:each="date : ${occupiedMap.dateList}"
					th:with="mapKey=${date.toString() + '_' + time.toString()}"
					th:classappend="${roomEntry.value.get(mapKey)} ? ' bg-danger' : ''">
					<span th:if="${roomEntry.value.get(mapKey)}">
					</span>
				</td>
			</tr>
		</tbody>
	</table>
</div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
