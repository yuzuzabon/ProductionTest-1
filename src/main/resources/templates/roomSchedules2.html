<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<link th:href="@{/css/style.css}" rel="stylesheet" />
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<title>Document</title>
</head>
<body>
	<div class="container mt-4">
		<div class="mb-3">
					<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
					<a th:href="@{/show}" class="btn btn-secondary">一覧</a>
					<a th:href="@{/add}" class="btn btn-secondary">講座登録</a>
		</div>
			<ul>
				<li th:each="date : ${occupiedMap.dateList}" th:text="${date}"></li>
		  </ul>
		<a th:href="@{roomSchedules2(baseDate=${prevDate})}">前週</a>
		<a th:href="@{roomSchedules2}">今週</a>
		<a th:href="@{roomSchedules2(baseDate=${nextDate})}">翌週</a>
		<br />
		<label for="datePicker">日付を指定：</label>
		<input type="date" id="datePicker" value="${baseDate}" onchange="location.href='/roomSchedules2?baseDate='+this.value"/>
		
		
	</div>
</body>
</html>
