<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />

	<link th:href="@{/css/style.css}" rel="stylesheet" />
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />

	<title>空き教室確認</title>
	<style>
			/* マス目の高さやデザインを微調整したい場合のカスタムCSS */
			.schedule-table td {
				height: 50px;
				transition: background-color 0.2s;
			}
			.cell-occupied {
				background-color: #f8d7da !important; /* 薄い赤（Bootstrapのbg-danger-subtle相当） */
				color: #842029;
				font-weight: bold;
			}
			.cell-empty {
				background-color: #ffffff;
			}
		</style>
</head>

<body>

<div class="container">

	<h1 class="mt-4 mb-4">空き教室確認</h1>

	<div class="mb-3">
		<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
		<a th:href="@{/show}" class="btn btn-secondary">一覧</a>
		<a th:href="@{/add}" class="btn btn-secondary">講座登録</a>
	</div>

	<div class="mb-4">
		<a th:href="@{roomSchedules3(baseDate=${prevDate})}"
		   class="btn btn-secondary">前週</a>

		<a th:href="@{roomSchedules3}"
		   class="btn btn-secondary">今週</a>

		<a th:href="@{roomSchedules3(baseDate=${nextDate})}"
		   class="btn btn-secondary">翌週</a>
	</div>

	<div class="mb-4">
		<label for="datePicker" class="form-label">
			日付を指定
		</label>

		<input type="date"
			   id="datePicker"
			   class="form-control"
			   th:value="${baseDate}"
			   onchange="location.href='/roomSchedules3?baseDate='+this.value">
	</div>

	<div class="container mt-4">

			<div th:each="roomEntry : ${occupiedMap.occupiedMap}" class="mb-5">

				<h2 th:text="${roomEntry.key}" class="text-primary mb-3">教室名</h2>

				<table class="table table-bordered text-center align-middle schedule-table">
					<thead class="table-light">
						<tr>
							<th style="width: 15%;">時間 / 日付</th>
							<th th:each="date : ${occupiedMap.dateList}" th:text="${date}" style="width: 12%;">日付</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="time : ${occupiedMap.timeList}">
							<td th:text="${time}" class="fw-bold table-light">10:00</td>

							<td th:each="date : ${occupiedMap.dateList}"
							    th:with="mapKey=${date.toString() + '_' + time.toString()}"
							    th:classappend="${roomEntry.value.get(mapKey)} ? 'cell-occupied' : 'cell-empty'">

								<span th:if="${roomEntry.value.get(mapKey)}"></span>
								<span th:if="${!roomEntry.value.get(mapKey)}" class="text-muted" style="opacity: 0.2;">-</span>

							</td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
