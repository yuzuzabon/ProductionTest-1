<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<link th:href="@{/css/style.css}" rel="stylesheet" />
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<title>受講申し込み</title>
	<style>
		/* スケジュールごとの外枠スタイル */
		.schedule-container {
			border: 1px solid #dee2e6;
			border-radius: 0.25rem;
			margin-bottom: 1.5rem;
			padding: 1rem;
			background-color: #fff;
		}
		/* 終了した講座用のスタイル（薄く表示） */
				.schedule-ended {
					background-color: #e9ecef;
					color: #6c757d;
					border-color: #ced4da;
				}

		/* 変更フォーム用のレイアウト（最初は非表示、展開時に左側に境界線を追加） */
		.edit-area {
			background-color: #f8f9fa;
			border-left: 2px dashed #dee2e6;
			padding-left: 1.5rem;
		}
	</style>
</head>
<body>
	<div class="container mt-4">
		<div class="mb-3">
			<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
			<a th:href="@{/members}" class="btn btn-secondary">受講生選択にもどる</a>
			<a th:href="@{/member/{id}(id=${member.id},page=${page})}" class="btn btn-secondary">講座選択にもどる</a>
		</div>

		<div th:if="${statusMessage}" class="alert alert-success mt-4">
		    <span th:text="${statusMessage}"></span>
		</div>

		<div th:if="${errorMessage}" class="alert alert-danger mt-4">
		    <span th:text="${errorMessage}"></span>
		</div>

		<h4 class="mb-3">受講生</h4>

		<table class="table table-bordered table-striped mb-4">
			<thead class="table-dark">
				<tr>
					<th>ID</th>
					<th>氏名</th>
					<th>年齢</th>
					<th>住所</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>[[${member.id}]]</td>
					<td>[[${member.name}]]</td>
					<td>[[${member.age}]]</td>
					<td>[[${member.address}]]</td>
				</tr>
					<th>申し込み履歴</th>
						<td colspan="3">
						<span class="badge bg-primary me-1"
						 th:each="h : ${history}"
						 th:text="${h.courseId}"></span>
			<!--	<span th:text="${h.memberStatus}"></span> -->
						</td>
			</tbody>
		</table>

		<h4 class="mb-3">講座</h4>

		<table class="table table-bordered mb-4" th:each="c : ${course}">
			<tr>
				<th class="w-25">講座番号</th>
				<td th:text="${c.courseId}"></td>
			</tr>
			<tr>
				<th>タイトル</th>
				<td th:text="${c.title}"></td>
			</tr>
			<tr>
				<th>内容</th>
				<td th:text="${c.detail}"></td>
			</tr>
			<tr>
				<th>回数</th>
				<td>
				<span	th:text="${c.courseTerm}"></span>
				<span th:text="| （途中受講${c.allowLateEnrollment ? 
					'可　残り'+rcData.remainingCount+'回':'不可'}）|"
							th:classappend="${!c.allowLateEnrollment} ? 
							'text-danger'"></span>
				</td> 
			</tr>
			
<!-- 1. 全回数受講の場合のみ表示（全回数 == 残回数） -->
			<tr th:if="${c.courseTerm == rcData.remainingCount}">
				<th>受講料等(消費税等込み)</th>
				<td>
					<span th:text="${#numbers.formatInteger
						(c.courseTerm * c.tuitionFee + c.materialFee,1,'COMMA')}"></span>円
					（受講料：<span th:text="${#numbers.formatInteger
						(c.tuitionFee,1,'COMMA')}"></span>円 ×
					<span th:text="${c.courseTerm}"></span>回 /
					教材費：<span th:text="${#numbers.formatInteger
						(c.materialFee,1,'COMMA')}"></span>円 ）
				</td>
			</tr>
			
<!-- 2. 途中受講の場合のみ表示（全回数 > 残回数） -->
			<tr th:if="${c.courseTerm > rcData.remainingCount}">
				<th th:utext="|受講料等(消費税等込み)<br>(残り${rcData.remainingCount}回)|"></th>
					<td>
						<span th:text="${#numbers.formatInteger
							(rcData.remainingCount * rcData.tuition + rcData.material,1,'COMMA')}"></span>円
						（受講料：<span th:text="${#numbers.formatInteger(rcData.tuition,1,'COMMA')}"></span>円 ×
						<span th:text="${rcData.remainingCount}"></span>回 /
						教材費：<span th:text="${#numbers.formatInteger(rcData.material,1,'COMMA')}"></span>円 ）
					</td>
			</tr>
			<tr>
				<th>定員情報</th>
				<td>
					定員: <span th:text="${c.courseCapacity.capacity}"></span> /
					申込数: <span th:text="${c.courseCapacity.numberOfApplicant}"></span> /
					空き: <span th:text="${c.courseCapacity.capacity - c.courseCapacity.numberOfApplicant}"></span>
					<form th:action="@{/apply}" method="post"  th:unless="${isApplied}">
						<input type="hidden" name="id" th:value="${member.id}"/>
						<input type="hidden" name="courseId" th:value="${c.courseId}"/>
						<input type="hidden" name="page" th:value="${page}">
<!-- 3. ボタンの動的切り替え（全回数: btn-secondary / 途中受講: btn-warning） -->
							<button type="submit" 
								class="btn"
								th:classappend="${c.courseTerm > rcData.remainingCount} ? 'btn-warning' : 'btn-secondary'"
								th:disabled="${c.courseCapacity.capacity <= c.courseCapacity.numberOfApplicant}"
								th:text="${c.courseTerm > rcData.remainingCount} ? '途中受講申し込み' : '受講申し込み'">
								受講申し込み
							</button>
						
<!--						<button type="submit" class="btn btn-secondary"-->
<!--						th:disabled="${c.courseCapacity.capacity <= c.courseCapacity.numberOfApplicant}"-->
<!--						>受講申し込み</button>-->
					<span th:if="${c.courseCapacity.capacity <= c.courseCapacity.numberOfApplicant}"
						class="text-danger">
						空きがありません
					</span>
					</form>
					<!-- <a th:href="@{/apply/{id}(id=${member.id},courseId=${c.courseId})}" class="btn btn-secondary">受講</a> -->
				</td>
			</tr>

		</table>

		<h4 class="mb-3">詳細</h4>

		<div th:each="c : ${course}">
			<div class="row">

				<div th:each="r, stat : ${c.classRoomSchedule}"
					 class="col-md-4 mb-3">
<!-- 4. 過去日付の場合に 'schedule-ended' クラスを付与してグレーアウト -->
					<div class="schedule-container h-100"
						th:classappend="${r.date.isBefore(#temporals.createToday())
							or (r.date.isEqual(#temporals.createToday()) 
							and r.startTime.isBefore(#temporals.createNow().toLocalTime()))
						} ? 'schedule-ended'"					
						th:data-index="${stat.index}">

						<form th:action="@{/updateSchedule}"
							  method="post"
							  class="schedule-form">

							<input type="hidden"
								   name="courseId"
								   th:value="${c.courseId}" />

							<input type="hidden"
								   name="id"
								   th:value="${r.id}" />
							<div class="border-bottom pb-2 mb-2 d-flex justify-content-between align-items-center">
								<h5 class="mb-0" 
										th:classappend="${r.date.isBefore(#temporals.createToday())
											or (r.date.isEqual(#temporals.createToday()) 
											and r.startTime.isBefore(#temporals.createNow().toLocalTime()))
										} ? 'text-muted' : 'text-primary'"
										th:text="${stat.count} + '回目'"></h5>
								<!-- 終了済みのラベルを表示（任意） -->
								<span th:if="${r.date.isBefore(#temporals.createToday())}" class="badge bg-secondary">終了</span>
							</div>
<!--							<div class="border-bottom pb-2 mb-2">-->
<!--								<h5 class="text-primary mb-0"-->
<!--									th:text="${stat.count} + '回目'"></h5>-->
<!--							</div>-->

							<table class="table table-sm table-borderless mb-0">
								<tr>
									<th>開催日</th>
									<td th:text="${r.date}"></td>
								</tr>

								<tr>
									<th>開始時間</th>
									<td th:text="${r.startTime}"></td>
								</tr>

								<tr>
									<th>終了時間</th>
									<td th:text="${r.endTime}"></td>
								</tr>

								<tr>
									<th>講座時間</th>
									<td th:text="${r.coursePeriod} + '分'"></td>
								</tr>

								<tr>
									<th>教室</th>
									<td th:text="${r.classRoom.classRoom}"></td>
								</tr>
							</table>

						</form>

			</div>
		</div>
	</div>
	</div>

</body>
</html>
