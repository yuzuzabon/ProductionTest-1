<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<link th:href="@{/css/style.css}" rel="stylesheet" />
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<title>受講申し込み</title>
	<style>
		/* スケジュールごとの外枠スタイル */
		.schedule-container {
			border: 1px solid #dee2e6;
			border-radius: 0.25rem;
			margin-bottom: 1.5rem;
			padding: 1rem;
			background-color: #fff;
		}
		/* 変更フォーム用のレイアウト（最初は非表示、展開時に左側に境界線を追加） */
		.edit-area {
			background-color: #f8f9fa;
			border-left: 2px dashed #dee2e6;
			padding-left: 1.5rem;
		}
	</style>
</head>
<body>
	<div class="container mt-4">
		<div class="mb-3">
			<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
			<a th:href="@{/show}" class="btn btn-secondary">講座一覧</a>
			<a th:href="@{/add}" class="btn btn-primary">講座登録</a>
			<a th:href="@{/roomSchedules4}" class="btn btn-secondary">空き教室確認</a>
			<a th:href="@{/member/{id}(id=${member.id})}" class="btn btn-secondary">講座選択にもどる</a>
		</div>

		<div th:if="${statusMessage}" class="alert alert-success mt-4">
		    <span th:text="${statusMessage}"></span>
		</div>

		<div th:if="${errorMessage}" class="alert alert-danger mt-4">
		    <span th:text="${errorMessage}"></span>
		</div>
		
		<h4 class="mb-3">受講生</h4>
		
		<table class="table table-bordered table-striped mb-4">
			<thead class="table-dark">
				<tr>
					<th>ID</th>
					<th>氏名</th>
					<th>年齢</th>
					<th>住所</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>[[${member.id}]]</td>
					<td>[[${member.name}]]</td>
					<td>[[${member.age}]]</td>
					<td>[[${member.address}]]</td>
				</tr>
					<th>申し込み履歴</th>
						<td colspan="3">
						<span class="badge bg-primary me-1"
						 th:each="h : ${history}"									
						 th:text="${h.courseId}"></span>	
			<!--	<span th:text="${h.memberStatus}"></span> -->
						</td>
			</tbody>
		</table>
		
		<h4 class="mb-3">講座</h4>
		
		<table class="table table-bordered mb-4" th:each="c : ${course}">
			<tr>
				<th class="w-25">講座番号</th>
				<td th:text="${c.courseId}"></td>
			</tr>
			<tr>
				<th>タイトル</th>
				<td th:text="${c.title}"></td>
			</tr>
			<tr>
				<th>内容</th>
				<td th:text="${c.detail}"></td>
			</tr>
			<tr>
				<th>回数</th>
				<td th:text="${c.courseTerm}"></td>
			</tr>
			<tr>
				<th>受講料等(消費税等込み)</th>
				<td>
					<span th:text="${#numbers.formatInteger(c.courseTerm * c.tuitionFee + c.materialFee,3,'COMMA')}"></span>円 
					（受講料：<span th:text="${#numbers.formatInteger(c.tuitionFee,1,'COMMA')}"></span>円 ×
					<span th:text="${c.courseTerm}"></span>回 /
					教材費：<span th:text="${#numbers.formatInteger(c.materialFee,1,'COMMA')}"></span>円 ）
				</td>
			</tr>
			<tr>
				<th>定員情報</th>
				<td>
					定員: <span th:text="${c.courseCapacity.capacity}"></span> /
					申込数: <span th:text="${c.courseCapacity.numberOfApplicant}"></span> /
					空き: <span th:text="${c.courseCapacity.capacity - c.courseCapacity.numberOfApplicant}"></span>
					<form th:action="@{/apply}" method="post"  th:unless="${isApplied}">
						<input type="hidden" name="id" th:value="${member.id}"/>
						<input type="hidden" name="courseId" th:value="${c.courseId}"/>
						<button type="submit" class="btn btn-secondary"
						th:disabled="${c.courseCapacity.capacity <= c.courseCapacity.numberOfApplicant}"
						>受講申し込み</button>
					<span th:if="${c.courseCapacity.capacity <= c.courseCapacity.numberOfApplicant}"
						class="text-danger">
						空きがありません
					</span>		
					</form>
					<!-- <a th:href="@{/apply/{id}(id=${member.id},courseId=${c.courseId})}" class="btn btn-secondary">受講</a> -->
				</td>
			</tr>

		</table>

		<h4 class="mb-3">詳細</h4>

		<div th:each="c : ${course}">
			<div class="row">

				<div th:each="r, stat : ${c.classRoomSchedule}"
					 class="col-md-4 mb-3">

					<div class="schedule-container h-100"
						 th:data-index="${stat.index}">

						<form th:action="@{/updateSchedule}"
							  method="post"
							  class="schedule-form">

							<input type="hidden"
								   name="courseId"
								   th:value="${c.courseId}" />

							<input type="hidden"
								   name="id"
								   th:value="${r.id}" />

							<div class="border-bottom pb-2 mb-2">
								<h5 class="text-primary mb-0"
									th:text="${stat.count} + '回目'"></h5>
							</div>

							<table class="table table-sm table-borderless mb-0">
								<tr>
									<th>開催日</th>
									<td th:text="${r.date}"></td>
								</tr>

								<tr>
									<th>開始時間</th>
									<td th:text="${r.startTime}"></td>
								</tr>

								<tr>
									<th>終了時間</th>
									<td th:text="${r.endTime}"></td>
								</tr>

								<tr>
									<th>講座時間</th>
									<td th:text="${r.coursePeriod} + '分'"></td>
								</tr>

								<tr>
									<th>教室</th>
									<td th:text="${r.classRoom.classRoom}"></td>
								</tr>
							</table>

						</form>

			</div>
		</div>
	</div>

</body>
</html>
