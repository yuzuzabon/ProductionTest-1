<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Document</title>
</head>
<body>
	<h3>【テスト出力】DBから一括取得した既存スケジュール一覧</h3>
	<table border="1" style="border-collapse: collapse; width: 100%; text-align: center;">
	    <thead>
	        <tr style="background-color: #f2f2f2;">
	            <th>ID</th>
	            <th>教室ID</th>
	            <th>日付</th>
	            <th>開始時間</th>
	            <th>終了時間</th>
	        </tr>
	    </thead>
	    <tbody>
	        <tr th:each="schedule : ${testSchedules}">
	            <td th:text="${schedule.id}">ID</td>
	            <td th:text="${schedule.classRoomId}">教室ID</td>
	            <td th:text="${schedule.date}">日付</td>
	            <td th:text="${schedule.startTime}">開始時間</td>
	            <td th:text="${schedule.endTime}">終了時間</td>
	        </tr>
	        <tr th:if="${#lists.isEmpty(testSchedules)}">
	            <td colspan="5" style="color: blue;">指定された日付・教室の既存スケジュールはDBにありません（重複なし）。</td>
	        </tr>
	    </tbody>
	</table>
</body>
</html>
