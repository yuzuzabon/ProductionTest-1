<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />

	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<link th:href="@{/css/style.css}" rel="stylesheet" />

	<title>講座一覧</title>
</head>

<body>

<div class="container">

	<h1 class="mt-4 mb-4">払い戻し対象講座一覧</h1>

	<div class="mb-3">
		<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
		<a th:href="@{/add}" class="btn btn-primary">講座登録</a>
		<a th:href="@{/roomSchedules}" class="btn btn-secondary">空き教室確認</a>
	</div>

	<table class="table table-striped table-bordered table-hover">

		<thead class="table-dark text-center align-middle border-light">
			<tr>
				<th>講座番号</th>
				<th>タイトル</th>
				<th>回数</th>

				<th>開催日</th>
				<th>開始時間</th>
				<th>終了時間</th>

				<th>申込数</th>


				<th>詳細</th>
			</tr>
		</thead>

		<tbody>
			<tr th:each="c : ${courses}">

				<td>[[${c.courseId}]]</td>
				<td>[[${c.title}]]</td>
				<td class="text-center">[[${c.courseTerm}]]</td>

				<td><div th:each="s : ${c.classRoomSchedule}" class="text-center">[[${s.date}]]</div></td>
				<td><div th:each="s : ${c.classRoomSchedule}" class="text-center">[[${s.startTime}]]</div></td>
				<td><div th:each="s : ${c.classRoomSchedule}" class="text-center">[[${s.endTime}]]</div></td>

				<td class="text-center">[[${c.courseCapacity.numberOfApplicant}]]</td>


				<td> <a th:href="@{/cancelledSchedule/{id}(id=${c.courseId},page=${page},searchType=${searchType})}"
						class="btn btn-secondary">詳細</a></td>
<!--				class="btn" th:classappend="${c.allowLateEnrollment} ? 'btn-primary':'btn-secondary'">詳細</a></td>-->
			</tr>
		</tbody>
	</table>
</div>

<!-- ページネーションリンクエリア -->
<!-- 2 ページ以上の場合、ページネーションを表示:start -->
<div th:if="${totalPages >= 2}" class="container mt-3">

	<div class="d-flex justify-content-center gap-1 flex-wrap">

		<!-- 前のページ -->
		<th:block th:switch="${page}">
			<span th:case="1" class="btn btn-secondary disabled">&laquo;</span>

			<a th:case="*"
			   th:href="@{/cancelledSchedule(page=${page - 1},searchType=${searchType})}"
			   class="btn btn-secondary">
				&laquo;
			</a>
		</th:block>

		<!-- ページ番号 -->
		<th:block th:each="index : ${#numbers.sequence(1, totalPages)}">

			<th:block th:switch="${index}">

				<span th:case="${page}"
				      class="btn btn-dark">
					[[${index}]]
				</span>

				<a th:case="*"
				   th:href="@{/cancelledSchedule(page=${index},searchType=${searchType})}"
				   class="btn btn-secondary">
					[[${index}]]
				</a>

			</th:block>

		</th:block>

		<!-- 次のページ -->
		<th:block th:switch="${page}">

			<span th:case="${totalPages}"
			      class="btn btn-secondary disabled">
				&raquo;
			</span>

			<a th:case="*"
			   th:href="@{/cancelledSchedule(page=${page + 1},searchType=${searchType})}"
			   class="btn btn-secondary">
				&raquo;
			</a>

		</th:block>

	</div>

</div>
<!-- 2 ページ以上の場合、ページネーションを表示:end -->

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
