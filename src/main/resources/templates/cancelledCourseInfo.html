<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<link th:href="@{/css/style.css}" rel="stylesheet" />
	<title>講座詳細・変更</title>

</head>
<body>
	<div class="container mt-4">
		<div class="mb-3">
			<a th:href="@{/menu}" class="btn btn-secondary">メニュー</a>
			<a th:href="@{/cancelledSchedule(page=${page},searchType=${searchType})}" class="btn btn-secondary">一覧</a>
			<a th:href="@{/add}" class="btn btn-primary">講座登録</a>
			<a th:href="@{/roomSchedules}" class="btn btn-secondary">空き教室確認</a>
		</div>

		<div th:if="${statusMessage}" class="alert alert-success mt-4">
		    <span th:text="${statusMessage}"></span>
		</div>

		<div th:if="${errorMessage}" class="alert alert-danger mt-4">
		    <span th:text="${errorMessage}"></span>
		</div>

		<table class="table table-bordered mb-4" th:each="c : ${course}">

			<tr>
				<th class="w-25">講座番号</th>
				<td th:text="${c.courseId}"></td>
			</tr>
			<tr>
				<th>タイトル</th>
				<td th:text="${c.title}"></td>
			</tr>
			<tr>
				<th>内容</th>
				<td th:text="${c.detail}"></td>
			</tr>
			<tr>
				<th>回数</th>
				<td>
				<span	th:text="${c.courseTerm}+回"></span>
				<span th:text="'(残り'+${rcData.remainingCount}+'回)'"></span>

				<form th:action="@{/cancelledSchedule/{id}(id=${c.courseId})}" method="post">

					<input type="hidden" name="courseId" th:value="${c.courseId}"/>
					<input type="hidden" name="page" th:value="${page}">
					<input type="hidden" name="searchType" th:value="${searchType}">
				<button type="submit"
					class="btn btn-danger fw-bold toggle-edit-btn"
					th:if="${rcData.remainingCount > 0}">
				<span th:text="${c.courseTerm == rcData.remainingCount}? '講座中止（'+${rcData.remainingCount}+'回）':'以降講座中止（'+${rcData.remainingCount}+'回）'"></span>
				</button>
				</form>
				</td>
			</tr>

<!-- 1. 全回数受講の場合のみ表示（全回数 == 残回数） -->
	<tr th:if="${c.courseTerm == rcData.remainingCount}">
				<th>返金見込み額（講座中止）</th>
				<td>
					<div th:with="grandTotal=${refundSummaryMap != null && !refundSummaryMap.isEmpty()
							? #aggregates.sum(refundSummaryMap.values().![totalRefundAmount]) : 0}">
					  <p th:text="|${#numbers.formatInteger(grandTotal,1,'COMMA')}円|"></p>
					</div>
					<span th:text="|（受講料：@${#numbers.formatInteger(rcData.tuition,1,'COMMA')}円|"></span>
					<span th:if="${c.courseCapacity.numberOfApplicant != 0 and rcData.material != 0}"
						th:text="|教材費： @${#numbers.formatInteger(rcData.material,1,'COMMA')}円|"></span>）

				</td>

<!-- 2. 途中受講の場合のみ表示（全回数 > 残回数） -->
	<tr th:if="${c.courseTerm > rcData.remainingCount}">
				<th th:utext="|返金見込み額（講座中止）（残り${rcData.remainingCount}回）|"></th>
				<td>
					<div th:with="grandTotal=${refundSummaryMap != null && !refundSummaryMap.isEmpty()
							? #aggregates.sum(refundSummaryMap.values().![totalRefundAmount]) : 0}">
					  <p th:text="|${#numbers.formatInteger(grandTotal,1,'COMMA')}円|"></p>
					</div>
					<span th:text="|（受講料：@${#numbers.formatInteger(rcData.tuition,1,'COMMA')}円|"></span>
					<span th:if="${c.courseCapacity.numberOfApplicant != 0 and rcData.material != 0}"
						th:text="|教材費： @${#numbers.formatInteger(rcData.material,1,'COMMA')}円|"></span>）

				</td>
	</tr>
		<tr  th:if="${rcData.remainingCount >1}">
			<th>返金見込み額（休講）</th>
				<td>
					<span th:text="${#numbers.formatInteger
								(rcData.tuition *c.courseCapacity.numberOfApplicant,1,'COMMA')}"></span>円
								（受講料：<span th:text="${#numbers.formatInteger(rcData.tuition,1,'COMMA')}">
					</span>円 ×
					<span th:text="${c.courseCapacity.numberOfApplicant}"></span>人）
				</td>
		</tr>

			<tr>
				<th>定員情報</th>
				<td>
					定員: <span th:text="${c.courseCapacity.capacity}"></span> /
					申込数: <span th:text="${c.courseCapacity.numberOfApplicant}"></span>
					空き: <span th:text="${c.courseCapacity.capacity - c.courseCapacity.numberOfApplicant}"></span>
					<form th:action="@{/apply}" method="post"  th:unless="${isApplied}">
<!--								<input type="hidden" name="id" th:value="${member.id}"/>-->
						<input type="hidden" name="courseId" th:value="${c.courseId}"/>
						<input type="hidden" name="page" th:value="${page}">

<!--					<span th:if="${c.courseCapacity.capacity <= c.courseCapacity.numberOfApplicant}"-->
<!--						class="text-danger">-->
<!--						空きがありません-->
<!--					</span>-->
					</form>
							<!-- <a th:href="@{/apply/{id}(id=${member.id},courseId=${c.courseId})}" class="btn btn-secondary">受講</a> -->
				</td>
			</tr>

		</table>


		<table class="table table-striped table-bordered table-hover">

<!--				<thead class="table-dark">-->
				<thead class="">
					<tr>
						<th>受講者ID</th>

						<th>ステータス</th>
						<th>残り日程</th>
						<th>返金対象：受講料</th>
						<th>返金対象：教材費</th>
						<th>返金見込み合計</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="entry : ${refundSummaryMap}" th:with="item=${entry.value}">
						<td th:text="${entry.key}"></td>
						<td>
							<div class="d-flex flex-column align-items-start gap-1">
						    <span th:if="${item.isBeforeStart}" class="badge bg-success">受講開始前</span>
						    <span th:if="${!item.isBeforeStart && !item.isFinished}" class="badge bg-warning text-dark">受講途中</span>
						    <span th:if="${item.isFinished}" class="badge bg-secondary">全日程終了</span>
								<span th:if="${item.firstItem?.chLateEnrollment == 1}" class="badge bg-info text-dark ms-1">途中受講</span>
							</div>
						</td>

						<td>
							<!-- 💡 返金対象となる残りの日程を縦並びで表示 -->
							<div th:if="${!item.isFinished}" class="pt-1 text">
							  <div th:each="s : ${item.remainingSchedules}">
							     <span th:text="${#temporals.format(s.crsDate, 'yyyy/MM/dd')}">2026/08/25</span>
<!--							     <span th:text="${s.crsStartTime}">10:00</span>-->
							  </div>
							</div>
							  <div th:if="${item.isFinished}" class="small text-muted">
							      （全日程終了のため対象日なし）
							  </div>
						</td>

						<td>
						    <span th:text="${#numbers.formatInteger(item.refundTuitionFee,1,'COMMA')} + '円'">1000円</span>
						    <small class="text-muted d-block" th:if="${!item.isFinished}">
						        (@<span th:text="${#numbers.formatInteger(item.firstItem.cTuitionFee,1,'COMMA')}">500</span>円 × <span th:text="${item.remainingCount}">2</span>回)
						    </small>
						</td>

						<td>
							<!-- 1. 初回開始前 かつ 教材費がある場合（返金対象） -->
						  <span th:if="${item.isBeforeStart and item.refundMaterialFee > 0}"
								th:text="${#numbers.formatInteger(item.refundMaterialFee,1,'COMMA')} + '円'">500円</span>
							<!-- 2. 受講開始後の場合（教材費の設定があっても返金対象外） -->
							<span th:if="${!item.isBeforeStart and item.firstItem.chPaidMaterialFee > 0}"
							  class="text-muted">0円（対象外）</span>
					    <!-- 3. 元々の教材費設定が0円の場合 -->
					    <span th:if="${item.firstItem.chPaidMaterialFee == 0}">0円</span>
						</td>

						<td class="fw-bold text-primary">
						      <span th:text="${#numbers.formatInteger(item.totalRefundAmount,1,'COMMA')} + '円'">1500円</span>
						</td>
					</tr>
				</tbody>


		</table>
		<!-- 詳細セクション -->
			<h4 class="mb-3">詳細</h4>

			<div th:each="c : ${course}">
				<div class="row">

					<div th:each="r, stat : ${c.classRoomSchedule}"
						 class="col-md-4 mb-3">
						<!-- 4. 過去日付の場合に 'schedule-ended' クラスを付与してグレーアウト -->
						<!-- 変数 isEndedOrCancelled に「終了または中止」の判定をまとめる -->
						<div th:with="isEndedOrCancelled=${
										r.scheduleStatus == 'CANCELLED_COURSE'
										or r.scheduleStatus == 'CANCELLED_SESSION'
										or r.date.isBefore(#temporals.createToday())
										or (r.date.isEqual(#temporals.createToday())
										and r.startTime.isBefore(#temporals.createNow().toLocalTime()))
								}"
							class="schedule-container h-100"
							th:classappend="${isEndedOrCancelled} ? 'schedule-ended'"
							th:data-index="${stat.index}">

							<form th:action="@{/cancelledSession/{id}(id=${c.courseId})}"
								  method="post"
								  class="schedule-form">

								<input type="hidden"
									   name="courseId"
									   th:value="${c.courseId}" />

								<input type="hidden"
									   name="id"
									   th:value="${r.id}" />

								<div class="border-bottom pb-2 mb-2 d-flex justify-content-between align-items-center">
									<h5 class="mb-0"
										th:classappend="${isEndedOrCancelled} ? 'text-muted' : 'text-primary'"
									 	th:text="${stat.count} + '回目'"></h5>

									<!-- バッジ表示：中止の場合は「中止」、休講の場合は「休講」、終了の場合は「終了」 -->
									<div>
										<span th:if="${r.scheduleStatus == 'CANCELLED_COURSE'}" class="badge bg-danger">中止</span>
										<span th:if="${r.scheduleStatus == 'CANCELLED_SESSION'}" class="badge bg-warning">休講</span>
										<span th:if="${r.scheduleStatus != 'CANCELLED_COURSE' and r.scheduleStatus != 'CANCELLED_SESSION' and isEndedOrCancelled}" class="badge bg-secondary">終了</span>
									</div>
								</div>

								<table class="table table-sm table-borderless mb-0">
									<tbody>
										<tr>
											<th>開催日</th>
											<td th:text="${r.date}"></td>
										</tr>

										<tr>
											<th>開始時間</th>
											<td th:text="${r.startTime}"></td>
										</tr>

										<tr>
											<th>終了時間</th>
											<td th:text="${r.endTime}"></td>
										</tr>

										<tr>
											<th>講座時間</th>
											<td th:text="${r.coursePeriod} + '分'"></td>
										</tr>

										<tr>
											<th>教室</th>
											<td th:text="${r.classRoom.classRoom}"></td>
										</tr>
									</tbody>
								</table>

								<!-- 休講ボタン：終了・中止・過去日程でなく、残回数が2回以上の場合（右寄せ） -->
<!--								<div class="d-flex justify-content-end mt-2"-->

								<div class="border-top pt-2 mt-2 text-end"
									 th:if="${!isEndedOrCancelled and rcData != null and rcData.remainingCount > 1}">
									<button type="submit"
											class="btn btn-warning fw-bold px-4 py-2 toggle-edit-btn">
										この日程を休講
									</button>
								</div>
							</form>

						</div>
					</div>
				</div>
			</div>


	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>

</script>
</body>
</html>
