<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>

	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
	<title>講座詳細・変更</title>
	<style>
		/* スケジュールごとの外枠スタイル */
		.schedule-container {
			border: 1px solid #dee2e6;
			border-radius: 0.25rem;
			margin-bottom: 1.5rem;
			padding: 1rem;
			background-color: #fff;
		}
		/* 終了した講座用のスタイル（薄く表示） */
				.schedule-ended {
					background-color: #e9ecef;
					color: #6c757d;
					border-color: #ced4da;
				}
		/* 変更フォーム用のレイアウト（最初は非表示、展開時に左側に境界線を追加） */
		.edit-area {
			background-color: #f8f9fa;
			border-left: 2px dashed #dee2e6;
			padding-left: 1.5rem;
		}
	</style>
</head>

<!--						（受講料：<span th:text="${#numbers.formatInteger(rcData.tuition,1,'COMMA')}"></span>円 ×-->

<!--							教材費：<span th:text="${#numbers.formatInteger(rcData.material,1,'COMMA')}"></span>円 ）-->
<!--				</td>-->
<!--	</tr>-->
			<tr>

<!--								<input type="hidden" name="id" th:value="${member.id}"/>-->

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
// 💡 特定のスケジュールコンテナに対して、選択された開始時間＋固定の講座時間で17:00を超えないかチェックする関数
function validatePeriodForContainer(container) {
    const startTimeSelect = container.querySelector('.change-start-time');
    const periodInput = container.querySelector('.base-period-val');
    const submitBtn = container.querySelector('.submit-btn');
    const errorMsg = container.querySelector('.period-error-msg');

    if (!startTimeSelect || !periodInput) return;

    // 開始時間を「分」に変換
    const [hour, min] = startTimeSelect.value.split(':').map(Number);
    const startTotalMinutes = hour * 60 + min;

    // 固定されている既存の講座時間（分）を取得
    const periodMin = parseInt(periodInput.value, 10);
    const maxTotalMinutes = 17 * 60; // 17:00 は 1020分

    // 終了時間が17:00を超える場合の制御
    if (startTotalMinutes + periodMin > maxTotalMinutes) {
        errorMsg.textContent = `終了時間が17:00を超えるため、この開始時間は選択できません。（終了予定 ${Math.floor((startTotalMinutes + periodMin)/60)}:${String((startTotalMinutes + periodMin)%60).padStart(2, '0')}）`;
        submitBtn.disabled = true; // 保存ボタンを無効化
    } else {
        errorMsg.textContent = '';
        submitBtn.disabled = false; // 保存ボタンを有効化
    }
}

// 開始時間が変更されたら、該当する回のコンテナだけバリデーションを実行
document.addEventListener('change', function(event) {
    if (event.target.classList.contains('change-start-time')) {
        const container = event.target.closest('.schedule-container');
        validatePeriodForContainer(container);
    }
});

// 「この回を変更する」ボタンを押したときの表示・非表示切り替え処理
document.querySelectorAll('.toggle-edit-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const container = this.closest('.schedule-container');
        const infoArea = container.querySelector('.info-area');
        const arrowArea = container.querySelector('.arrow-area');
        const editArea = container.querySelector('.edit-area');

        // 変更フォームが現在非表示の場合 -> 表示する
        if (editArea.classList.contains('d-none')) {
            editArea.classList.remove('d-none');
            arrowArea.classList.remove('d-none');
            // 左側の表示幅を狭めて右側フォームが入るスペースを作る (col-md-5)
            infoArea.className = 'col-md-5 info-area';

            this.textContent = '変更をキャンセル';
            this.classList.replace('btn-outline-primary', 'btn-outline-secondary');

            // フォームを開いた瞬間に一度17:00超えチェックを走らせる
            validatePeriodForContainer(container);
        }
        // 変更フォームが現在表示されている場合 -> 非表示（詳細表示のみ）に戻す
        else {
            editArea.classList.add('d-none');
            arrowArea.classList.add('d-none');
            // フォームが消えるので、詳細テーブルを幅いっぱいに戻す (col-md-12)
            infoArea.className = 'col-md-12 info-area';

            this.textContent = 'この回を変更する';
            this.classList.replace('btn-outline-secondary', 'btn-outline-primary');
        }
    });
});

// 画面読み込み時、左側の詳細表示を幅いっぱいに設定するための初期化
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.info-area').forEach(info => {
        info.className = 'col-md-12 info-area';
    });
});

// フォーム送信時の最終防衛チェック
document.querySelectorAll('.schedule-form').forEach(form => {
    form.addEventListener('submit', function(event) {
        const container = this.closest('.schedule-container');
        const editArea = container.querySelector('.edit-area');

        // 変更エリアが表示されていない（ボタンが押されていない）状態での誤送信をブロック
        if (editArea.classList.contains('d-none')) {
            event.preventDefault();
            return;
        }

        const startTimeSelect = container.querySelector('.change-start-time');
        const periodInput = container.querySelector('.base-period-val');

        if (startTimeSelect && periodInput) {
            const [hour, min] = startTimeSelect.value.split(':').map(Number);
            const startTotalMinutes = hour * 60 + min;
            const periodMin = parseInt(periodInput.value, 10);

            if (startTotalMinutes + periodMin > 1020) {
                alert('終了時間が17:00を超えるため、登録できません。');
                event.preventDefault();// 17:00 は 1020分
            }
        }
    });
});
</script>
</body>
</html>
